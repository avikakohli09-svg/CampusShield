<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CampusShield — Responder Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#030b18;--surface:#081220;--surface-2:rgba(255,255,255,0.04);
  --border:rgba(255,255,255,0.08);--border-bright:rgba(255,255,255,0.14);
  --text:#f1f5f9;--muted:#64748b;--muted2:#94a3b8;
  --blue:#3b82f6;--blue-dark:#2563eb;--blue-glow:rgba(59,130,246,0.5);
  --red:#ff3b3b;--orange:#f97316;--yellow:#eab308;--green:#10b981;--purple:#8b5cf6;
  --critical:#ff3b3b;--high:#f97316;--medium:#eab308;--low:#10b981;
  --radius:16px;--radius-sm:10px;
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border-bright);border-radius:4px}

/* ── Background ── */
.bg-blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.15}
.blob-1{width:600px;height:600px;background:#3b82f6;top:-200px;left:-150px;animation:blobDrift 14s ease-in-out infinite}
.blob-2{width:400px;height:400px;background:#8b5cf6;bottom:-100px;right:-100px;animation:blobDrift 10s ease-in-out infinite reverse}
@keyframes blobDrift{0%,100%{transform:scale(1)}50%{transform:scale(1.08) translate(15px,-15px)}}

/* ── Layout: 3-pane desktop, stacked mobile ── */
.app-shell{position:relative;z-index:1;height:100vh;display:grid;grid-template-rows:56px 1fr;grid-template-columns:72px 320px 1fr}
@media(max-width:900px){.app-shell{grid-template-columns:1fr;grid-template-rows:56px auto 1fr}}

/* ── Top Nav ── */
.topnav{
  grid-column:1/-1;grid-row:1;
  display:flex;align-items:center;gap:1rem;
  padding:0 1.25rem;
  background:rgba(3,11,24,.9);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);z-index:200;
}
.nav-brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1rem;margin-right:auto}
.nav-brand span{font-size:1.4rem}
.nav-tag{background:rgba(59,130,246,.2);border:1px solid rgba(59,130,246,.3);color:#93c5fd;border-radius:6px;padding:.15rem .5rem;font-size:.7rem;font-weight:700}
.ws-badge{display:flex;align-items:center;gap:.35rem;padding:.3rem .7rem;border-radius:100px;background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:.72rem;color:var(--muted2)}
.ws-dot{width:7px;height:7px;border-radius:50%;background:#10b981;animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 6px #10b981}50%{opacity:.3;box-shadow:none}}
.ws-dot.off{background:#ef4444;animation:none}
.nav-metric{display:flex;flex-direction:column;align-items:center;padding:0 .8rem;border-left:1px solid var(--border)}
.nav-metric .nm-val{font-size:1.1rem;font-weight:800;line-height:1}
.nav-metric .nm-label{font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:.1rem}
.nm-val.critical{color:var(--red)}
.nm-val.ok{color:var(--green)}
.nav-back{color:var(--muted2);text-decoration:none;font-size:.8rem;padding:.35rem .7rem;border-radius:8px;border:1px solid var(--border);transition:all .2s;white-space:nowrap}
.nav-back:hover{background:var(--surface-2);color:var(--text)}

/* ── Sidebar icons ── */
.sidebar-icons{
  grid-column:1;grid-row:2;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:.8rem 0;
  overflow:hidden;
}
@media(max-width:900px){.sidebar-icons{display:none}}
.sicon{
  width:46px;height:46px;border-radius:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;
  transition:all .2s;border:1px solid transparent;
}
.sicon:hover{background:rgba(255,255,255,.07);border-color:var(--border-bright)}
.sicon.active{background:rgba(59,130,246,.2);border-color:rgba(59,130,246,.4)}
.sicon-badge{position:relative}
.sicon-badge::after{
  content:attr(data-count);position:absolute;top:-4px;right:-4px;
  background:var(--red);color:#fff;font-size:.6rem;font-weight:700;
  min-width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 3px;
}
.sicon-badge[data-count="0"]::after{display:none}

/* ── Incidents Panel ── */
.incidents-panel{
  grid-column:2;grid-row:2;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
@media(max-width:900px){.incidents-panel{grid-column:1;max-height:50vh}}

.panel-header{
  padding:.9rem 1rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.panel-title{font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:.5rem}
.incident-count{background:rgba(255,59,59,.2);color:#fca5a5;border-radius:100px;padding:.1rem .5rem;font-size:.7rem;font-weight:700;border:1px solid rgba(255,59,59,.3)}
.filter-row{display:flex;gap:.35rem;padding:.6rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0}
.filter-chip{
  padding:.25rem .6rem;border-radius:100px;font-size:.7rem;font-weight:600;cursor:pointer;
  border:1px solid var(--border);color:var(--muted2);background:transparent;transition:all .2s;white-space:nowrap;
}
.filter-chip.active{background:rgba(59,130,246,.2);border-color:rgba(59,130,246,.4);color:#93c5fd}
.incidents-list{flex:1;overflow-y:auto;padding:.5rem}

/* ── Incident Card ── */
.inc-card{
  border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,.025);
  margin-bottom:.5rem;cursor:pointer;overflow:hidden;
  transition:all .25s;position:relative;
}
.inc-card:hover{border-color:var(--border-bright);background:rgba(255,255,255,.045);transform:translateX(2px)}
.inc-card.selected{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.08);box-shadow:0 0 0 1px rgba(59,130,246,.3) inset}
.inc-card.escalated{border-color:rgba(255,59,59,.4);animation:escalatedBlink 2s ease-in-out infinite}
@keyframes escalatedBlink{0%,100%{border-color:rgba(255,59,59,.4)}50%{border-color:rgba(255,59,59,.8);box-shadow:0 0 16px rgba(255,59,59,.2)}}

.inc-card-inner{padding:.75rem .9rem}
.inc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:.4rem}
.inc-code{font-size:.65rem;font-family:monospace;color:var(--muted);background:rgba(255,255,255,.06);padding:.1rem .4rem;border-radius:4px}
.priority-badge{font-size:.62rem;font-weight:700;padding:.15rem .5rem;border-radius:100px;white-space:nowrap}
.priority-badge.critical{background:rgba(255,59,59,.2);color:#fca5a5;border:1px solid rgba(255,59,59,.35)}
.priority-badge.high{background:rgba(249,115,22,.2);color:#fdba74;border:1px solid rgba(249,115,22,.35)}
.priority-badge.medium{background:rgba(234,179,8,.2);color:#fde68a;border:1px solid rgba(234,179,8,.35)}
.priority-badge.low{background:rgba(16,185,129,.2);color:#6ee7b7;border:1px solid rgba(16,185,129,.35)}

.inc-type-row{display:flex;align-items:center;gap:.45rem;margin-bottom:.3rem}
.inc-emoji{font-size:1.2rem}
.inc-typename{font-weight:700;font-size:.9rem}
.inc-loc{font-size:.75rem;color:var(--muted2);display:flex;align-items:center;gap:.3rem}
.inc-reporter{font-size:.7rem;color:var(--muted);margin-top:.3rem}
.inc-time{font-size:.65rem;color:var(--muted);margin-top:.1rem}
.inc-status-row{margin-top:.5rem;display:flex;align-items:center;gap:.4rem}
.status-chip{font-size:.65rem;font-weight:600;padding:.15rem .5rem;border-radius:100px}
.status-chip.reported{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.2)}
.status-chip.acknowledged{background:rgba(234,179,8,.15);color:#fde68a;border:1px solid rgba(234,179,8,.2)}
.status-chip.dispatched{background:rgba(249,115,22,.15);color:#fdba74;border:1px solid rgba(249,115,22,.2)}
.status-chip.on_site{background:rgba(59,130,246,.15);color:#93c5fd;border:1px solid rgba(59,130,246,.2)}
.status-chip.resolved{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.2)}
.status-chip.cancelled{background:rgba(100,116,139,.15);color:#94a3b8;border:1px solid rgba(100,116,139,.2)}
.esc-chip{font-size:.62rem;font-weight:700;background:rgba(255,59,59,.15);color:#fca5a5;border:1px solid rgba(255,59,59,.3);padding:.15rem .5rem;border-radius:100px;display:flex;align-items:center;gap:.25rem}

/* Priority left bar */
.inc-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:4px 0 0 4px}
.inc-card[data-priority="critical"]::before{background:var(--critical)}
.inc-card[data-priority="high"]::before{background:var(--high)}
.inc-card[data-priority="medium"]::before{background:var(--medium)}
.inc-card[data-priority="low"]::before{background:var(--low)}

/* ── Map Panel ── */
.map-panel{grid-column:3;grid-row:2;position:relative;overflow:hidden}
@media(max-width:900px){.map-panel{grid-column:1;min-height:380px}}
#main-map{width:100%;height:100%;background:#050e1c}
.map-controls{position:absolute;top:.8rem;right:.8rem;z-index:999;display:flex;flex-direction:column;gap:.5rem}
.map-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border-bright);
  background:rgba(5,14,28,.88);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:1rem;transition:all .2s;color:var(--text);
}
.map-btn:hover{background:rgba(59,130,246,.2);border-color:rgba(59,130,246,.4)}

/* ── Detail drawer (bottom sheet on mobile, right slide-in on desktop) ── */
.detail-drawer{
  position:absolute;bottom:0;left:0;right:0;z-index:500;
  background:rgba(5,14,28,.95);backdrop-filter:blur(24px);
  border-top:1px solid var(--border-bright);
  border-radius:20px 20px 0 0;
  max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1);
}
.detail-drawer.open{max-height:70vh;overflow-y:auto}
@media(min-width:900px){
  .detail-drawer{
    left:auto;right:0;top:0;bottom:0;width:360px;
    border-radius:0;border-top:none;border-left:1px solid var(--border-bright);
    max-height:none;max-width:0;overflow:hidden;
    transition:max-width .4s cubic-bezier(.4,0,.2,1);
  }
  .detail-drawer.open{max-width:360px;max-height:none;overflow-y:auto}
}
.drawer-handle{width:40px;height:4px;background:var(--border-bright);border-radius:4px;margin:.8rem auto;display:block}
@media(min-width:900px){.drawer-handle{display:none}}
.drawer-inner{padding:1rem 1.25rem 2rem}

/* ── Action buttons ── */
.action-btn{
  display:flex;align-items:center;justify-content:center;gap:.6rem;
  width:100%;padding:.85rem;border-radius:12px;border:none;cursor:pointer;
  font-family:inherit;font-size:.9rem;font-weight:700;transition:all .2s;
  margin-bottom:.5rem;
}
.action-btn.accept{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 4px 20px rgba(16,185,129,.35)}
.action-btn.accept:hover{box-shadow:0 4px 30px rgba(16,185,129,.55);transform:translateY(-1px)}
.action-btn.dispatch{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;box-shadow:0 4px 20px rgba(249,115,22,.35)}
.action-btn.dispatch:hover{box-shadow:0 4px 30px rgba(249,115,22,.55);transform:translateY(-1px)}
.action-btn.onsite{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;box-shadow:0 4px 20px rgba(59,130,246,.35)}
.action-btn.onsite:hover{box-shadow:0 4px 30px rgba(59,130,246,.55);transform:translateY(-1px)}
.action-btn.resolve{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;box-shadow:0 4px 20px rgba(139,92,246,.35)}
.action-btn.resolve:hover{box-shadow:0 4px 30px rgba(139,92,246,.55);transform:translateY(-1px)}
.action-btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.action-btn.secondary{background:var(--surface-2);border:1px solid var(--border);color:var(--muted2)}
.action-btn.secondary:hover{border-color:var(--border-bright);color:var(--text)}

.location-share-toggle{
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);
  border-radius:12px;padding:.8rem 1rem;margin-bottom:.5rem;
}
.lst-left{display:flex;align-items:center;gap:.7rem}
.lst-icon{font-size:1.4rem}
.lst-label{font-weight:600;font-size:.85rem}
.lst-sub{font-size:.72rem;color:var(--muted2)}
.toggle-switch{position:relative;width:44px;height:24px;cursor:pointer}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#1e293b;border-radius:12px;transition:.3s;border:1px solid var(--border)}
.toggle-slider::before{content:'';position:absolute;width:18px;height:18px;left:2px;bottom:2px;background:#64748b;border-radius:50%;transition:.3s}
input:checked + .toggle-slider{background:rgba(16,185,129,.3);border-color:rgba(16,185,129,.5)}
input:checked + .toggle-slider::before{transform:translateX(20px);background:#10b981;box-shadow:0 0 8px rgba(16,185,129,.6)}

/* ── Drawer detail sections ── */
.drawer-section{margin-bottom:1.2rem}
.drawer-section-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.6rem;font-weight:600;display:flex;align-items:center;gap:.4rem}
.detail-row{display:flex;justify-content:space-between;align-items:flex-start;padding:.4rem 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:.82rem}
.detail-row:last-child{border-bottom:none}
.detail-label{color:var(--muted);min-width:90px}
.detail-val{font-weight:600;text-align:right;color:var(--text);max-width:170px;word-break:break-word}

.log-entry{font-size:.72rem;color:var(--muted2);padding:.35rem .6rem;background:rgba(255,255,255,.03);border-radius:6px;margin-bottom:.3rem;border-left:2px solid var(--border-bright)}
.log-event-tag{font-weight:700;color:var(--text);margin-right:.4rem;background:rgba(255,255,255,.08);border-radius:3px;padding:.05rem .3rem;font-size:.65rem}

/* ── Stat bar ── */
.stat-bar{display:flex;gap:.6rem;padding:.6rem 1rem;background:rgba(255,255,255,.025);border-top:1px solid var(--border);flex-shrink:0}
.stat{flex:1;text-align:center}
.stat-val{font-size:1.3rem;font-weight:800;line-height:1}
.stat-label{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat-val.red{color:var(--red)}.stat-val.orange{color:var(--orange)}.stat-val.green{color:var(--green)}.stat-val.blue{color:var(--blue)}

/* ── Map dark tiles ── */
.leaflet-tile-pane{filter:brightness(.65) saturate(.7) hue-rotate(205deg) contrast(1.05)}
.leaflet-container{background:#050e1c!important}
.leaflet-popup-content-wrapper{background:#081220;color:#f1f5f9;border:1px solid rgba(255,255,255,.1);border-radius:12px}
.leaflet-popup-tip{background:#081220}
.leaflet-control-zoom a{background:#081220!important;color:#f1f5f9!important;border-color:var(--border)!important}

/* ── Toast ── */
#toast-container{position:fixed;top:1rem;right:1rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;max-width:340px}
.toast{display:flex;align-items:flex-start;gap:.7rem;background:rgba(8,18,32,.97);border-radius:14px;padding:1rem;border-left:4px solid var(--green);backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(0,0,0,.6);animation:toastIn .3s cubic-bezier(.4,0,.2,1) forwards;font-size:.85rem}
.toast.error{border-color:var(--red)}.toast.warning{border-color:var(--orange)}.toast.info{border-color:var(--blue)}
@keyframes toastIn{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateX(50px)}}
.toast-title{font-weight:700;color:var(--text);margin-bottom:.2rem}
.toast-msg{color:var(--muted2);font-size:.8rem}

/* ── Sim bar ── */
.sim-bar{background:rgba(139,92,246,.08);border-top:1px solid rgba(139,92,246,.2);padding:.5rem 1rem;display:flex;gap:.4rem;align-items:center;flex-shrink:0;overflow-x:auto}
.sim-bar-label{font-size:.7rem;color:var(--purple);font-weight:700;white-space:nowrap}
.sim-btn{padding:.3rem .7rem;border-radius:8px;border:1px solid rgba(139,92,246,.3);background:rgba(139,92,246,.1);color:#c4b5fd;font-size:.7rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
.sim-btn:hover{background:rgba(139,92,246,.25);border-color:rgba(139,92,246,.5)}

/* ── Empty state ── */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;color:var(--muted);padding:2rem}
.empty-state .e-icon{font-size:3rem;margin-bottom:.5rem}
.empty-state .e-title{font-weight:600;color:var(--muted2)}
.empty-state .e-sub{font-size:.8rem;text-align:center}

/* ── Spinner ── */
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Responders mini list ── */
.resp-mini{display:flex;align-items:center;gap:.7rem;padding:.5rem .6rem;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--border);margin-bottom:.3rem}
.resp-mini-status{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.resp-mini-status.available{background:#10b981;box-shadow:0 0 6px #10b981}
.resp-mini-status.assigned{background:#f97316;box-shadow:0 0 6px #f97316}
.resp-mini-status.en_route{background:#3b82f6;box-shadow:0 0 6px #3b82f6;animation:blink 1.5s infinite}
.resp-mini-status.on_scene{background:#8b5cf6;box-shadow:0 0 6px #8b5cf6}
.resp-mini-status.off_duty{background:#64748b}
</style>
</head>
<body>
<div class="bg-blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

<div class="app-shell">

  <!-- ── TOP NAV ── -->
  <nav class="topnav">
    <div class="nav-brand"><span>🛡️</span> CampusShield <span class="nav-tag">RESPONDER</span></div>
    <div class="nav-metric"><span class="nm-val critical" id="metric-active">0</span><span class="nm-label">Active</span></div>
    <div class="nav-metric"><span class="nm-val red" id="metric-escalated">0</span><span class="nm-label">Escalated</span></div>
    <div class="nav-metric"><span class="nm-val ok" id="metric-available">0</span><span class="nm-label">Available</span></div>
    <div class="ws-badge"><span class="ws-dot off" id="ws-dot"></span><span id="ws-label">Connecting</span></div>
    <a href="/" class="nav-back">← Home</a>
  </nav>

  <!-- ── ICON SIDEBAR ── -->
  <div class="sidebar-icons">
    <div class="sicon active" title="Incidents">🚨</div>
    <div class="sicon sicon-badge" id="esc-icon" data-count="0" title="Escalations">⚠️</div>
    <div class="sicon" title="Responders">👮</div>
    <div class="sicon" title="Safe Points">🏥</div>
    <div style="flex:1"></div>
    <div class="sicon" title="Settings">⚙️</div>
  </div>

  <!-- ── INCIDENTS PANEL ── -->
  <div class="incidents-panel">
    <div class="panel-header">
      <div class="panel-title">🚨 Live Incidents <span class="incident-count" id="inc-count">0</span></div>
      <button onclick="refreshAll()" style="background:transparent;border:none;color:var(--muted2);cursor:pointer;font-size:1rem" title="Refresh">↻</button>
    </div>
    <div class="filter-row">
      <button class="filter-chip active" data-filter="all" onclick="setFilter(this,'all')">All</button>
      <button class="filter-chip" data-filter="reported" onclick="setFilter(this,'reported')">New</button>
      <button class="filter-chip" data-filter="dispatched" onclick="setFilter(this,'dispatched')">En Route</button>
      <button class="filter-chip" data-filter="resolved" onclick="setFilter(this,'resolved')">Resolved</button>
    </div>
    <div class="incidents-list" id="incidents-list">
      <div class="empty-state">
        <div class="e-icon">📡</div>
        <div class="e-title">Listening for incidents</div>
        <div class="e-sub">New reports will appear here instantly</div>
      </div>
    </div>
    <div class="stat-bar" id="stat-bar">
      <div class="stat"><div class="stat-val blue" id="stat-total">0</div><div class="stat-label">Total</div></div>
      <div class="stat"><div class="stat-val orange" id="stat-ack">—</div><div class="stat-label">Avg TTA</div></div>
      <div class="stat"><div class="stat-val green" id="stat-resolve">—</div><div class="stat-label">Avg Resolve</div></div>
    </div>
    <!-- Simulator -->
    <div class="sim-bar">
      <span class="sim-bar-label">🎬 Simulate:</span>
      <button class="sim-btn" onclick="runSim('library_collapse')">🏥 Collapse</button>
      <button class="sim-btn" onclick="runSim('chemistry_lab_fire')">🔥 Lab Fire</button>
      <button class="sim-btn" onclick="runSim('hostel_intruder_escalation')">🔒 Intruder</button>
      <button class="sim-btn" onclick="runSim('sports_heatstroke')">☀️ Heatstroke</button>
      <button class="sim-btn" onclick="resetSim()" style="color:#f87171;border-color:rgba(239,68,68,.3)">🗑️ Reset</button>
    </div>
  </div>

  <!-- ── MAP PANEL ── -->
  <div class="map-panel">
    <div id="main-map"></div>
    <div class="map-controls">
      <div class="map-btn" title="Fit all" onclick="fitAll()">⤢</div>
      <div class="map-btn" title="Campus center" onclick="goCenter()">🎯</div>
      <div class="map-btn" id="layer-btn" title="Toggle satellite" onclick="toggleLayer()">🗺️</div>
    </div>

    <!-- Detail Drawer -->
    <div class="detail-drawer" id="detail-drawer">
      <div class="drawer-handle"></div>
      <div class="drawer-inner" id="drawer-inner">
        <!-- filled by JS -->
      </div>
    </div>
  </div>

</div><!-- /app-shell -->

<div id="toast-container"></div>

<script>
// ═══════════════════════════════════════════════════════
//  CAMPUSSHIELD RESPONDER DASHBOARD — FRONTEND
// ═══════════════════════════════════════════════════════

const API = '';
const WS_URL = `ws://${location.host}/ws`;

let ws = null;
let incidents = {};
let responders = {};
let selectedId = null;
let activeFilter = 'all';
let map = null;
let incMarkers = {};
let respMarkers = {};
let routeLines = {};
let myCoords = null;
let myMarker = null;
let locationShareActive = false;
let locationShareInterval = null;
let locationWatchId = null;

const TYPE_ICONS = {
  medical:'🏥', fire:'🔥', security:'🚨', accident:'💥', hazard:'☣️', general:'⚠️'
};
const STATUS_ORDER = ['reported','acknowledged','dispatched','on_site','resolved','cancelled'];

// ── Init ──────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  connectWS();
  startSelfLocation();
});

// ── Map ───────────────────────────────────────────────
function initMap() {
  map = L.map('main-map', {
    center: [28.5458, 77.1920],
    zoom: 16,
    zoomControl: true,
    attributionControl: false
  });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  setTimeout(() => map.invalidateSize(), 300);
  window.addEventListener('resize', () => map.invalidateSize());
}

function fitAll() {
  const latlngs = Object.values(incMarkers).map(m => m.getLatLng());
  if (latlngs.length > 0) map.fitBounds(latlngs.map(l => [l.lat, l.lng]), {padding:[60,60]});
  else map.setView([28.5458, 77.1920], 16);
}
function goCenter() { map.setView([28.5458, 77.1920], 16); }
function toggleLayer() { goCenter(); }

// ── My location ───────────────────────────────────────
function startSelfLocation() {
  if (!navigator.geolocation) return;
  locationWatchId = navigator.geolocation.watchPosition(
    pos => {
      myCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      placeMyMarker();
    },
    () => {
      myCoords = { lat: 28.5458, lng: 77.1920 }; // campus center fallback
      placeMyMarker();
    },
    { enableHighAccuracy: true, maximumAge: 3000 }
  );
}

function placeMyMarker() {
  if (!myCoords) return;
  const icon = L.divIcon({
    html: `<div style="
      width:36px;height:36px;border-radius:50%;
      background:linear-gradient(135deg,#3b82f6,#6366f1);
      border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:1rem;
      box-shadow:0 0 0 6px rgba(59,130,246,.3),0 4px 12px rgba(0,0,0,.5);
    ">👮</div>`,
    iconSize:[36,36],iconAnchor:[18,18],className:''
  });
  if (!myMarker) {
    myMarker = L.marker([myCoords.lat, myCoords.lng], {icon, zIndexOffset:2000})
      .addTo(map).bindPopup('<b style="color:#3b82f6">📍 Your Position</b>');
  } else {
    myMarker.setLatLng([myCoords.lat, myCoords.lng]);
  }
}

// ── WebSocket ─────────────────────────────────────────
function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    document.getElementById('ws-dot').classList.remove('off');
    document.getElementById('ws-label').textContent = 'Live';
  };
  ws.onclose = () => {
    document.getElementById('ws-dot').classList.add('off');
    document.getElementById('ws-label').textContent = 'Reconnecting…';
    setTimeout(connectWS, 3000);
  };
  ws.onmessage = e => {
    try { handleWsEvent(JSON.parse(e.data)); } catch {}
  };
}

function handleWsEvent(msg) {
  const { event, data } = msg;
  switch(event) {
    case 'init_state':
      (data.incidents || []).forEach(i => incidents[i.id] = i);
      (data.responders || []).forEach(r => responders[r.id] = r);
      updateMetrics(data.metrics || {});
      renderAll();
      placeAllMarkers();
      break;
    case 'incident_created':
      incidents[data.id] = data;
      renderAll();
      placeIncMarker(data);
      showToast('🆘 New Incident!', `${data.code} — ${data.incident_type.toUpperCase()} at ${data.location_name}`, 'error');
      if (selectedId === null) selectIncident(data.id);
      break;
    case 'incident_updated':
      incidents[data.id] = data;
      renderAll();
      if (selectedId === data.id) renderDrawer(data);
      break;
    case 'responder_updated':
    case 'responder_moved':
      const r = data.responder || data;
      responders[r.id] = r;
      updateRespMarker(r);
      if (data.incident_id && incidents[data.incident_id]) {
        const inc = incidents[data.incident_id];
        if (inc.assigned_responder_id === r.id) inc.assigned_responder = r;
        if (selectedId === data.incident_id) renderDrawer(inc);
        updateRouteFor(inc);
      }
      break;
    case 'incident_escalated':
      incidents[data.incident.id] = data.incident;
      renderAll();
      if (selectedId === data.incident.id) renderDrawer(data.incident);
      showToast(`⚠️ ESCALATION L${data.level}`, `${data.incident.code} — ${data.level === 2 ? 'CRITICAL: Re-routing to backup unit' : 'No acknowledgment — reminder sent'}`, 'warning');
      document.getElementById('esc-icon').dataset.count =
        Object.values(incidents).filter(i => i.escalated && i.status !== 'resolved').length;
      break;
    case 'metrics_updated':
      updateMetrics(data);
      break;
    case 'campus_broadcast':
      showToast(`📢 ${data.title}`, data.message, 'info');
      break;
    case 'system_reset':
      incidents = {}; responders = {};
      clearAllMarkers();
      renderAll();
      closeDrawer();
      showToast('🔄 System Reset', 'All incidents cleared.', 'info');
      break;
  }
}

// ── Render incident list ──────────────────────────────
function renderAll() {
  const list = document.getElementById('incidents-list');
  let items = Object.values(incidents);
  if (activeFilter !== 'all') items = items.filter(i => i.status === activeFilter);
  // Sort: priority order then newest first
  const pOrd = {critical:0,high:1,medium:2,low:3};
  items.sort((a,b) => {
    if (a.status==='resolved'&&b.status!=='resolved') return 1;
    if (b.status==='resolved'&&a.status!=='resolved') return -1;
    if (pOrd[a.priority] !== pOrd[b.priority]) return pOrd[a.priority]-pOrd[b.priority];
    return new Date(b.created_at)-new Date(a.created_at);
  });

  document.getElementById('inc-count').textContent = Object.values(incidents).filter(i=>i.status!=='resolved'&&i.status!=='cancelled').length;

  if (items.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="e-icon">📡</div><div class="e-title">No incidents${activeFilter!=='all'?' in this filter':''}</div><div class="e-sub">New alerts will appear instantly</div></div>`;
    return;
  }

  list.innerHTML = items.map(inc => `
    <div class="inc-card${inc.id===selectedId?' selected':''}${inc.escalated&&inc.status!=='resolved'?' escalated':''}"
         data-priority="${inc.priority}" onclick="selectIncident('${inc.id}')">
      <div class="inc-card-inner">
        <div class="inc-top">
          <span class="inc-code">${inc.code}</span>
          <span class="priority-badge ${inc.priority}">${inc.priority.toUpperCase()}</span>
        </div>
        <div class="inc-type-row">
          <span class="inc-emoji">${TYPE_ICONS[inc.incident_type]||'⚠️'}</span>
          <span class="inc-typename">${inc.incident_type.charAt(0).toUpperCase()+inc.incident_type.slice(1)} Emergency</span>
        </div>
        <div class="inc-loc">📍 ${inc.location_name}${inc.floor_room?' · '+inc.floor_room:''}</div>
        <div class="inc-reporter">👤 ${inc.reporter_name} · ${inc.reporter_phone}</div>
        <div class="inc-time">🕐 ${timeSince(inc.created_at)}</div>
        <div class="inc-status-row">
          <span class="status-chip ${inc.status}">${inc.status.replace('_',' ').toUpperCase()}</span>
          ${inc.escalated ? `<span class="esc-chip">🔺 ESC L${inc.escalation_level}</span>` : ''}
          ${inc.assigned_responder ? `<span style="font-size:.65rem;color:var(--muted2)">→ ${inc.assigned_responder.name.split(' ')[0]}</span>` : ''}
        </div>
      </div>
    </div>`).join('');
}

function setFilter(el, f) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  activeFilter = f;
  renderAll();
}

// ── Select & Drawer ───────────────────────────────────
function selectIncident(id) {
  selectedId = id;
  renderAll();
  const inc = incidents[id];
  if (!inc) return;
  renderDrawer(inc);
  openDrawer();
  // Focus on map
  if (inc.coords) {
    map.setView([inc.coords.lat, inc.coords.lng], 17);
  }
}

function openDrawer() {
  document.getElementById('detail-drawer').classList.add('open');
}
function closeDrawer() {
  document.getElementById('detail-drawer').classList.remove('open');
  selectedId = null;
  renderAll();
}

function renderDrawer(inc) {
  const s = inc.status;
  const statusColors = {
    reported:'#fca5a5',acknowledged:'#fde68a',dispatched:'#fdba74',
    on_site:'#93c5fd',resolved:'#6ee7b7',cancelled:'#94a3b8'
  };

  // Action buttons
  let actions = '';
  if (s === 'reported') {
    actions = `<button class="action-btn accept" onclick="doAction('acknowledge','${inc.id}')">✓ Accept Incident</button>`;
  } else if (s === 'acknowledged') {
    actions = `<button class="action-btn dispatch" onclick="doAction('dispatch','${inc.id}')">🚗 Mark Dispatched / En Route</button>`;
  } else if (s === 'dispatched') {
    actions = `<button class="action-btn onsite" onclick="doAction('on-site','${inc.id}')">🏁 Mark Arrived On Site</button>`;
  } else if (s === 'on_site') {
    actions = `<button class="action-btn resolve" onclick="doAction('resolve','${inc.id}')">✅ Resolve Incident</button>`;
  } else if (s === 'resolved') {
    actions = `<div style="text-align:center;padding:.6rem;color:#6ee7b7;font-weight:700">✅ Incident Resolved</div>`;
  }

  // Location share toggle (show when dispatched or on_site)
  const showLocShare = (s === 'dispatched' || s === 'acknowledged' || s === 'on_site');
  const locShareHtml = showLocShare ? `
    <div class="location-share-toggle" id="loc-share-toggle">
      <div class="lst-left">
        <span class="lst-icon">📍</span>
        <div>
          <div class="lst-label">Share Live Location</div>
          <div class="lst-sub" id="loc-share-status">Reporter will see you on the map</div>
        </div>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="loc-share-chk" ${locationShareActive?'checked':''} onchange="toggleLocationShare('${inc.id}')">
        <span class="toggle-slider"></span>
      </label>
    </div>` : '';

  // Responder info
  const resp = inc.assigned_responder;
  const respHtml = resp ? `
    <div style="display:flex;gap:.7rem;align-items:center;padding:.7rem;background:rgba(255,255,255,.03);border-radius:10px;border:1px solid var(--border)">
      <div style="width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,rgba(59,130,246,.3),rgba(99,102,241,.2));display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0">👮</div>
      <div>
        <div style="font-weight:700;font-size:.9rem">${resp.name}</div>
        <div style="font-size:.72rem;color:var(--muted2)">${resp.role}</div>
        <div style="display:inline-flex;align-items:center;gap:.3rem;margin-top:.3rem;font-size:.65rem;background:rgba(59,130,246,.12);color:#93c5fd;border:1px solid rgba(59,130,246,.2);padding:.15rem .5rem;border-radius:100px">${resp.unit_code}</div>
        ${resp.eta_seconds != null ? `<div style="font-size:.8rem;margin-top:.2rem">ETA: <strong style="color:var(--orange)">${resp.eta_seconds <= 0 ? 'On site!' : Math.floor(resp.eta_seconds/60)+'m '+(resp.eta_seconds%60)+'s'}</strong></div>` : ''}
      </div>
    </div>` : `<div style="color:var(--muted);font-size:.8rem;padding:.5rem">No responder assigned</div>`;

  // Logs
  const logsHtml = (inc.logs || []).slice().reverse().slice(0,8)
    .map(l => `<div class="log-entry"><span class="log-event-tag">${l.event}</span>${l.details}<span style="display:block;font-size:.65rem;color:var(--muted);margin-top:.2rem">${new Date(l.timestamp).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})} · ${l.actor}</span></div>`)
    .join('') || '<div style="color:var(--muted);font-size:.8rem">No logs yet</div>';

  document.getElementById('drawer-inner').innerHTML = `
    <!-- Header -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1rem">
      <div>
        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem">
          <span style="font-size:1.5rem">${TYPE_ICONS[inc.incident_type]||'⚠️'}</span>
          <span style="font-size:1.1rem;font-weight:800">${inc.incident_type.charAt(0).toUpperCase()+inc.incident_type.slice(1)} Emergency</span>
        </div>
        <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
          <span style="font-family:monospace;font-size:.8rem;color:#93c5fd;background:rgba(59,130,246,.1);padding:.15rem .5rem;border-radius:5px;border:1px solid rgba(59,130,246,.2)">${inc.code}</span>
          <span class="status-chip ${s}" style="font-size:.7rem">${s.replace('_',' ').toUpperCase()}</span>
          <span class="priority-badge ${inc.priority}">${inc.priority.toUpperCase()}</span>
          ${inc.escalated ? `<span class="esc-chip">🔺 ESC L${inc.escalation_level}</span>` : ''}
        </div>
      </div>
      <button onclick="closeDrawer()" style="background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--muted2);border-radius:8px;padding:.35rem .6rem;cursor:pointer;font-size:.9rem">✕</button>
    </div>

    <!-- Actions -->
    <div class="drawer-section">
      ${actions}
      ${locShareHtml}
    </div>

    <!-- Details -->
    <div class="drawer-section">
      <div class="drawer-section-title">📋 Incident Details</div>
      <div class="detail-row"><span class="detail-label">Location</span><span class="detail-val">📍 ${inc.location_name}</span></div>
      ${inc.floor_room ? `<div class="detail-row"><span class="detail-label">Floor/Room</span><span class="detail-val">${inc.floor_room}</span></div>` : ''}
      <div class="detail-row"><span class="detail-label">Reporter</span><span class="detail-val">👤 ${inc.reporter_name}</span></div>
      <div class="detail-row"><span class="detail-label">Phone</span><span class="detail-val">${inc.reporter_phone}</span></div>
      ${inc.description ? `<div class="detail-row"><span class="detail-label">Description</span><span class="detail-val">${inc.description}</span></div>` : ''}
      <div class="detail-row"><span class="detail-label">Reported</span><span class="detail-val">${new Date(inc.created_at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span></div>
      ${inc.time_to_ack_sec != null ? `<div class="detail-row"><span class="detail-label">TTA</span><span class="detail-val">${inc.time_to_ack_sec}s</span></div>` : ''}
    </div>

    <!-- Responder -->
    <div class="drawer-section">
      <div class="drawer-section-title">🚑 Assigned Unit</div>
      ${respHtml}
    </div>

    <!-- Nearest Safe Point -->
    ${inc.nearest_safe_point ? `
    <div class="drawer-section">
      <div class="drawer-section-title">🏥 Nearest Safe Point</div>
      <div style="font-size:.82rem;line-height:1.5;color:var(--muted2);padding:.6rem;background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.15);border-radius:8px">
        <strong style="color:#6ee7b7">${inc.nearest_safe_point.name}</strong><br/>
        ${inc.nearest_safe_point.instructions}
      </div>
    </div>` : ''}

    <!-- Activity Log -->
    <div class="drawer-section">
      <div class="drawer-section-title">📋 Activity Log</div>
      ${logsHtml}
    </div>
  `;
}

// ── Actions ───────────────────────────────────────────
async function doAction(action, incId) {
  try {
    const res = await fetch(`${API}/api/incidents/${incId}/${action}`, {method:'POST'});
    if (!res.ok) throw new Error();
    const inc = await res.json();
    incidents[inc.id] = inc;
    renderAll();
    renderDrawer(inc);
    const msgs = {
      acknowledge: '✓ Incident acknowledged!',
      dispatch: '🚗 Marked as dispatched. Enable location sharing to let reporter track you.',
      'on-site': '🏁 Marked as on-site.',
      resolve: '✅ Incident resolved!'
    };
    showToast(msgs[action] || 'Updated', inc.code, 'success');

    // Auto-enable location sharing when dispatching
    if (action === 'dispatch') {
      setTimeout(() => {
        const chk = document.getElementById('loc-share-chk');
        if (chk && !locationShareActive) {
          chk.checked = true;
          toggleLocationShare(incId);
        }
      }, 400);
    }
    // Auto-stop sharing when resolved
    if (action === 'resolve') {
      stopLocationShare();
    }
  } catch {
    showToast('❌ Error', 'Could not update incident status', 'error');
  }
}

// ── Location sharing ──────────────────────────────────
function toggleLocationShare(incId) {
  const chk = document.getElementById('loc-share-chk');
  if (!chk) return;
  if (chk.checked) {
    startLocationShare(incId);
  } else {
    stopLocationShare();
  }
}

function startLocationShare(incId) {
  locationShareActive = true;
  updateLocShareUI(true);

  const pushLocation = async () => {
    if (!locationShareActive) return;
    const coords = myCoords || { lat: 28.5458, lng: 77.1920 };
    try {
      await fetch(`${API}/api/incidents/${incId}/location`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          lat: coords.lat + (Math.random() - 0.5) * 0.0003,  // slight movement sim
          lng: coords.lng + (Math.random() - 0.5) * 0.0003,
          responder_id: null
        })
      });
    } catch {}
  };

  pushLocation();
  locationShareInterval = setInterval(pushLocation, 3000);
  showToast('📍 Location Sharing ON', 'Reporter can now see your live position', 'success');
}

function stopLocationShare() {
  locationShareActive = false;
  if (locationShareInterval) { clearInterval(locationShareInterval); locationShareInterval = null; }
  updateLocShareUI(false);
}

function updateLocShareUI(active) {
  const el = document.getElementById('loc-share-status');
  if (el) {
    el.textContent = active
      ? '🟢 Sharing live · Reporter can see you'
      : 'Reporter will see you on the map';
  }
}

// ── Map markers ───────────────────────────────────────
function placeAllMarkers() {
  Object.values(incidents).forEach(inc => placeIncMarker(inc));
  Object.values(responders).forEach(r => updateRespMarker(r));
}

function clearAllMarkers() {
  Object.values(incMarkers).forEach(m => m.remove());
  Object.values(respMarkers).forEach(m => m.remove());
  Object.values(routeLines).forEach(l => l.remove());
  incMarkers = {}; respMarkers = {}; routeLines = {};
}

function placeIncMarker(inc) {
  if (!inc.coords) return;
  if (inc.status === 'resolved' || inc.status === 'cancelled') {
    if (incMarkers[inc.id]) { incMarkers[inc.id].remove(); delete incMarkers[inc.id]; }
    return;
  }
  const priorityColors = { critical:'#ff3b3b', high:'#f97316', medium:'#eab308', low:'#10b981' };
  const col = priorityColors[inc.priority] || '#3b82f6';
  const icon = L.divIcon({
    html: `<div style="
      width:40px;height:40px;border-radius:50%;
      background:linear-gradient(135deg,${col},${col}99);
      border:3px solid #fff;display:flex;align-items:center;justify-content:center;
      font-size:1.1rem;cursor:pointer;
      box-shadow:0 0 0 ${inc.escalated?'10px':'6px'} ${col}44,0 4px 12px rgba(0,0,0,.5);
      animation:${inc.escalated?'escalatedPulse':'incPulse'} 2s ease-in-out infinite;
    ">${TYPE_ICONS[inc.incident_type]||'⚠️'}</div>
    <style>
      @keyframes incPulse{0%,100%{box-shadow:0 0 0 6px ${col}44}50%{box-shadow:0 0 0 12px ${col}22}}
      @keyframes escalatedPulse{0%,100%{box-shadow:0 0 0 10px ${col}66,0 0 20px ${col}44}50%{box-shadow:0 0 0 20px ${col}33,0 0 40px ${col}22}}
    </style>`,
    iconSize:[40,40],iconAnchor:[20,20],className:''
  });

  if (incMarkers[inc.id]) {
    incMarkers[inc.id].setLatLng([inc.coords.lat, inc.coords.lng]);
    incMarkers[inc.id].setIcon(icon);
  } else {
    incMarkers[inc.id] = L.marker([inc.coords.lat, inc.coords.lng], {icon, zIndexOffset:500})
      .addTo(map)
      .bindPopup(`
        <b style="color:${col}">${TYPE_ICONS[inc.incident_type]} ${inc.code}</b><br/>
        <span style="font-size:.85rem">${inc.location_name}</span><br/>
        <span style="font-size:.8rem;color:#94a3b8">${inc.reporter_name}</span>
      `);
    incMarkers[inc.id].on('click', () => selectIncident(inc.id));
  }
  updateRouteFor(inc);
}

function updateRespMarker(r) {
  if (!r.coords) return;
  if (r.status === 'off_duty') {
    if (respMarkers[r.id]) { respMarkers[r.id].remove(); delete respMarkers[r.id]; }
    return;
  }
  const statusColors = { available:'#10b981', assigned:'#f97316', en_route:'#3b82f6', on_scene:'#8b5cf6' };
  const col = statusColors[r.status] || '#10b981';
  const icon = L.divIcon({
    html: `<div style="
      width:34px;height:34px;border-radius:10px;
      background:linear-gradient(135deg,${col},${col}bb);
      border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:1rem;
      box-shadow:0 0 0 4px ${col}33,0 3px 8px rgba(0,0,0,.5);
    ">👮</div>`,
    iconSize:[34,34],iconAnchor:[17,17],className:''
  });
  if (respMarkers[r.id]) {
    respMarkers[r.id].setLatLng([r.coords.lat, r.coords.lng]);
    respMarkers[r.id].setIcon(icon);
  } else {
    respMarkers[r.id] = L.marker([r.coords.lat, r.coords.lng], {icon, zIndexOffset:300})
      .addTo(map)
      .bindPopup(`<b style="color:${col}">👮 ${r.name}</b><br/><span style="font-size:.8rem">${r.role}</span><br/><span style="font-size:.75rem;color:#94a3b8">${r.unit_code} · ${r.status.replace('_',' ').toUpperCase()}</span>`);
  }
}

function updateRouteFor(inc) {
  if (!inc.assigned_responder || !inc.coords) return;
  const r = inc.assigned_responder;
  if (!r.coords) return;
  if (inc.status !== 'dispatched' && inc.status !== 'on_site') {
    if (routeLines[inc.id]) { routeLines[inc.id].remove(); delete routeLines[inc.id]; }
    return;
  }
  const pts = [[r.coords.lat, r.coords.lng], [inc.coords.lat, inc.coords.lng]];
  if (routeLines[inc.id]) {
    routeLines[inc.id].setLatLngs(pts);
  } else {
    routeLines[inc.id] = L.polyline(pts, {
      color:'#f97316', weight:3, opacity:.75, dashArray:'8 5'
    }).addTo(map);
  }
}

// ── Metrics ───────────────────────────────────────────
function updateMetrics(m) {
  document.getElementById('metric-active').textContent = m.active_incidents ?? 0;
  document.getElementById('metric-escalated').textContent = m.escalated_incidents ?? 0;
  document.getElementById('metric-available').textContent = m.available_responders ?? 0;
  document.getElementById('stat-total').textContent = m.total_incidents ?? 0;
  document.getElementById('stat-ack').textContent = m.avg_time_to_acknowledge_sec > 0 ? m.avg_time_to_acknowledge_sec + 's' : '—';
  document.getElementById('stat-resolve').textContent = m.avg_time_to_resolve_sec > 0 ? m.avg_time_to_resolve_sec + 's' : '—';
}

// ── Simulator ─────────────────────────────────────────
async function runSim(preset) {
  try {
    const res = await fetch(`${API}/api/simulator/run/${preset}`, { method: 'POST' });
    if (!res.ok) throw new Error();
    const inc = await res.json();
    showToast('🎬 Simulation', `${inc.code} launched — ${inc.incident_type} at ${inc.location_name}`, 'info');
  } catch { showToast('❌ Error', 'Simulation failed', 'error'); }
}
async function resetSim() {
  if (!confirm('Reset all incidents and responders?')) return;
  await fetch(`${API}/api/simulator/reset`, { method: 'POST' });
}
async function refreshAll() {
  try {
    const [iRes, mRes] = await Promise.all([
      fetch(`${API}/api/incidents`), fetch(`${API}/api/metrics`)
    ]);
    const incs = await iRes.json();
    const metrics = await mRes.json();
    incs.forEach(i => incidents[i.id] = i);
    updateMetrics(metrics);
    renderAll();
    placeAllMarkers();
  } catch { showToast('❌', 'Refresh failed', 'error'); }
}

// ── Toast ─────────────────────────────────────────────
function showToast(title, msg, type = 'success') {
  const icons = {success:'✅',error:'🔴',warning:'⚠️',info:'ℹ️'};
  const t = document.createElement('div');
  t.className = `toast ${type === 'success' ? '' : type}`;
  t.innerHTML = `<span style="font-size:1.3rem">${icons[type]||'ℹ️'}</span><div><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div>`;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => { t.style.animation = 'toastOut .3s forwards'; setTimeout(() => t.remove(), 350); }, 5000);
}

// ── Helpers ───────────────────────────────────────────
function timeSince(iso) {
  const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diff < 60) return `${diff}s ago`;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  return `${Math.floor(diff/3600)}h ago`;
}

// ── Keyboard shortcut: Escape to close drawer ─────────
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
</script>
